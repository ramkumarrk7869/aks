replicaCount: 2

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  className: nginx-internal
  host: nginx.internal.example.com
  path: /
  pathType: Prefix
  applicationGateway:
    enabled: false
    className: azure-application-gateway
