replicaCount: 2

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  className: azure-application-gateway
  host: nginx.internal.example.com
  path: /
  pathType: Prefix
  nginxRollback:
    enabled: true
    className: nginx-internal
